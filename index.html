{icon:'kick',label:'TE AȘTEPT ȘI PE KICK',handle:'kipzone'},
{icon:'tiktok',label:'LIVE PE TIKTOK / KICK / YOUTUBE',handle:'@kip.ro'},
{icon:'discord',label:'INTRĂ ÎN COMUNITATE · LINK ÎN BIO',handle:'KIP Gaming'},
{thanks:true,label:'HAI ÎN COMUNITATE!',handle:'POATE NU DAI FOLLOW 😄'},
{thanks:true,label:'ENERGIA LIVE-ULUI EȘTI TU',handle:'MULȚUMESC PENTRU TAP TAP!'},
{icon:'yst',sponsor:true,label:'YST · MODURI DE GRAFICĂ GTA',handle:'Cod KIP · 10% reducere'},
{icon:'tikstage',sponsor:true,label:'TIKSTAGE · INSTRUMENTE PENTRU LIVE',handle:'Cod KIP20 · 20% reducere'}
];

let i=0;const promo=document.querySelector('.promo');
function renderPromo(){const p=items[i];promo.classList.toggle('is-thanks',!!p.thanks);promo.classList.toggle('is-sponsor',!!p.sponsor);document.getElementById('platform-icon').src='assets/'+(p.icon||'kick')+(p.icon==='yst'?'.png':'.svg');document.getElementById('promo-label').textContent=p.label;document.getElementById('promo-handle').textContent=p.handle;promo.classList.remove('leaving');promo.classList.add('entering');}
renderPromo();setInterval(()=>{promo.classList.remove('entering');promo.classList.add('leaving');setTimeout(()=>{i=(i+1)%items.length;renderPromo();},300);},4500);
</script></body></html>
