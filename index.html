<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Overlay</title><link rel="stylesheet" href="overlay.css?v=live-clean-2"></head><body><main class="scene" id="scene"><div class="lower"></div><div class="band"><div class="promo"><div><small id="promo-label">GAMING &amp; COMUNITATE</small><strong id="promo-handle">BINE AI VENIT!</strong></div></div><div class="live"><i class="dot"></i>LIVE</div></div><div class="capture-line"></div><div class="side left"></div><div class="side right"></div><div class="corner left"></div><div class="corner right"></div><div class="glint cyan"></div><div class="glint orange"></div></main><script>function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);scene.style.transform=`translate(${(innerWidth-1080*s)/2}px,${(innerHeight-1920*s)/2}px) scale(${s})`;}fit();addEventListener('resize',fit);const items=[
{label:'GAMING & COMUNITATE',handle:'BINE AI VENIT!'},
{label:'BINE AI VENIT LA LIVE',handle:'BUCURĂ-TE DE JOC!'},
{thanks:true,label:'ENERGIA LIVE-ULUI EȘTI TU',handle:'MULȚUMESC CĂ EȘTI AICI!'}
];let i=0;const promo=document.querySelector('.promo');
function renderPromo(){const p=items[i];promo.classList.toggle('is-thanks',!!p.thanks);document.getElementById('promo-label').textContent=p.label;document.getElementById('promo-handle').textContent=p.handle;promo.classList.remove('leaving');promo.classList.add('entering');}
renderPromo();setInterval(()=>{promo.classList.remove('entering');promo.classList.add('leaving');setTimeout(()=>{i=(i+1)%items.length;renderPromo();},300);},4500);
</script></body></html>
