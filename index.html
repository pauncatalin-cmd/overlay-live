];

function renderPromo(){const p=items[i];promo.classList.toggle('is-account',!!p.account);promo.classList.toggle('is-thanks',!!p.thanks);promo.classList.toggle('is-sponsor',!!p.sponsor);if(p.icon) document.getElementById('platform-icon').src='assets/'+p.icon+(p.icon==='yst'?'.png':'.svg');document.getElementById('promo-label').textContent=p.label;document.getElementById('promo-handle').textContent=p.handle;promo.classList.remove('leaving');promo.classList.add('entering');}

const tikstage=items.findIndex(p=>p.icon==='tikstage');

setInterval(()=>{
 const elapsed=performance.now()-started;
 const phase=elapsed%120000;

 setTimeout(()=>{i=last;renderPromo();},300);
},100);
