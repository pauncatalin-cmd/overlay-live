<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mountain Troll — vertical</title><link rel="stylesheet" href="troll.css?v=kip-troll-1"></head><body><main id="scene" class=""><div class="lower"></div><div class="capture-line"></div><div class="side left"></div><div class="side right"></div></main><script>const scene=document.getElementById('scene');function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);scene.style.transform=`translate(${(innerWidth-1080*s)/2}px,${(innerHeight-1920*s)/2}px) scale(${s})`;}fit();addEventListener('resize',fit);</script></body></html>
